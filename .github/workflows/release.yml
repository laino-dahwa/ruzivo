name: Release

# Triggered by pushing a `vX.Y.Z` tag. Split into two dependent jobs rather
# than one, because GitHub Actions service containers (Docker-based) are
# only supported on Linux runners — `windows-latest` rejects a job outright
# at startup if it declares one, before any step runs. `verify` does the
# Postgres-dependent gate (migrate/lint/typecheck/test) on Linux; `release`
# only starts once that succeeds, and does the Windows-only build/package/
# publish, which needs no live database. Nothing here reuses a previous
# test.yml/build.yml run — a release re-verifies everything itself, just
# split across two jobs instead of one.

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ruzivo
      PGADMINDB: postgres

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify the pushed tag matches package.json's version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v$tag_version does not match package.json version $pkg_version — bump package.json and re-tag."
            exit 1
          fi

      - name: Apply database migrations
        run: npm run migrate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  release:
    needs: verify
    runs-on: windows-latest

    # electron-builder's GitHub publish target needs write access to create
    # the Release and upload assets — many repos now default GITHUB_TOKEN to
    # read-only, so this is requested explicitly rather than relying on that
    # repo setting. Scoped to just this job, which is the only one that
    # writes anything.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Next.js (standalone output)
        run: npm run electron:build:prod

      - name: Package and publish the Windows installer to GitHub Releases
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
